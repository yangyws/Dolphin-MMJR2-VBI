name: Build Android APK

on:
  push:
    branches:
      - main-zh
      - main
      - pr/i18n-traditional-chinese
  pull_request:
    branches:
      - main-zh
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Dolphin-MMJR2-VBI Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build ccache

      - name: Accept Android SDK Licenses and Install NDK
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build Android APK
        working-directory: Source/Android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Collect APK Artifacts
        run: |
          mkdir -p output_apks
          find Source/Android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} output_apks/ \;
          APK_FILE=$(find output_apks -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" output_apks/Dolphin-MMJR2-VBI-zh.apk
          fi
          ls -la output_apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-mmjr2-vbi-android-apk
          path: output_apks/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main-zh'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2407-zh
          name: "Dolphin-MMJR2-VBI-zh 掌機繁體中文共存版"
          body: |
            ### 🐬 Dolphin-MMJR2-VBI-zh 掌機繁體中文共存版

            - **底層核心**：Dolphin MMJR2 2407 + VBI Skip Hack（by Medard22）
            - **掌機獨立包名**：`org.dolphinemu.mmjr.zh`（可與原版並存安裝，資料互不干擾）
            - **完整在地化**：100% 台灣繁體中文前端介面與選單陣列支援
            - **閃退暗樁解除**：移除自訂套件檢查反改代碼，相容各品牌 Android 掌機與設備
          files: output_apks/Dolphin-MMJR2-VBI-zh.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
